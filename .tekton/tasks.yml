apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: alpine:3.20
      script: |
        #!/bin/sh
        echo "Cleaning workspace..."
        rm -rf "$(workspaces.source.path)"/*
        echo "Cleanup completed."

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: unit-test
spec:
  workspaces:
    - name: source
  steps:
    - name: test
      image: node:20
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        echo "Installing dependencies..."
        npm install
        echo "Running Jest unit tests..."
        npm test
